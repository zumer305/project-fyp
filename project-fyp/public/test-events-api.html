<!DOCTYPE html>
<html>
<head>
    <title>Events API Test</title>
</head>
<body>
    <h1>Testing Events API</h1>
    <button onclick="testAPI()">Test Events API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing...</p>';
            
            try {
                // Test 1: With city name
                console.log('Test 1: Fetching events for New York');
                const response1 = await fetch('/api/events?destination=New York');
                const data1 = await response1.json();
                console.log('Response 1:', data1);
                
                // Test 2: With coordinates
                console.log('Test 2: Fetching events with coordinates');
                const response2 = await fetch('/api/events?destination=London&lat=51.5074&lng=-0.1278');
                const data2 = await response2.json();
                console.log('Response 2:', data2);
                
                resultDiv.innerHTML = `
                    <h3>Test Results:</h3>
                    <p><strong>Test 1 (New York):</strong> ${data1.success ? `Found ${data1.count} events` : 'Failed'}</p>
                    <p><strong>Test 2 (London):</strong> ${data2.success ? `Found ${data2.count} events` : 'Failed'}</p>
                    <p>Check console for full details</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p style="color:red">Error: ${error.message}</p>`;
                console.error('Test error:', error);
            }
        }
    </script>
</body>
</html>
